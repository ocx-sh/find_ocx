name: Update dist snapshot

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [ocx-released]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dist
  cancel-in-progress: false

jobs:
  update:
    name: Bump ocx - snapshot, pin and CI pins in lockstep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Guard unit tests
        run: python3 -I -m unittest discover -s scripts -p update_dist_test.py
      - name: Bump snapshot, __OCX_PIN_VERSION and setup-ocx pins
        run: |
          python3 scripts/update_dist.py
          python3 scripts/update_dist.py --check
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # GITHUB_TOKEN-created PRs never trigger CI workflows, and it cannot
          # push changes under .github/workflows/ (the setup-ocx pins live
          # there); a PAT with the workflow scope does both.
          token: ${{ secrets.DIST_UPDATE_TOKEN }}
          branch: chore/update-dist
          commit-message: "chore(dist): bump ocx to the latest stable release"
          title: "chore(dist): bump ocx to the latest stable release"
          body: >
            Automated lockstep bump from the setup.ocx.sh release manifest
            (`scripts/update_dist.py`): the snapshot embedded in `ocx.cmake`,
            `__OCX_PIN_VERSION` and every `ocx-sh/setup-ocx` `version:` pin
            move together. The script refuses rewritten or dropped rows, a
            non-stable `latest`, and a pin that does not move forward. Read
            the ocx changelog before merging: find_ocx is tested against
            exactly the pinned version.
