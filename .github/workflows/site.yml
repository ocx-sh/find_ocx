name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "examples/**"
      - "tests/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/ci.yml"
      - "ocx.cmake"
      - "Findocx.cmake"
      - "ocx.toml"
      - "ocx.lock"
      - "taskfile.yml"
      - ".github/workflows/site.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.5"
      - name: Build the site and check it
        run: ocx exec -- task site:check

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.5"
      # Lighthouse drives Playwright's Chromium; install its system libraries first (the task fetches only the browser).
      - name: Install Chromium system libraries
        run: ocx exec -- pnpm --dir site exec playwright-core install-deps chromium
      - name: Audit the built site
        run: ocx exec -- task site:lighthouse
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: site/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
