name: Docs

on:
  push:
    branches: [main]
    paths:
      - "site/scripts/stubs.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: ocx-sh/setup-ocx@v1
        with:
          version: "0.6.5"

      # The docs live at https://ocx.sh/integrations/cmake/; this site only forwards the old URLs.
      - name: Write the forwarding stubs
        run: ocx exec -- node site/scripts/stubs.mjs stubs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stubs

      - id: deployment
        uses: actions/deploy-pages@v4
