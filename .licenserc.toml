[header]
text = """
SPDX-License-Identifier: Apache-2.0
Copyright 2026 The OCX Authors"""

[files]
includes = [
    "*.cmake",
    "CMakeLists.txt",
    "tests/**/*.cmake",
    "tests/**/CMakeLists.txt",
    "examples/**/CMakeLists.txt",
    "scripts/**/*.py",
]
excludes = ["build/**"]

# hawkeye knows CMakeLists.txt but not the .cmake extension; without this mapping
# it skips every module and test script as "unsupported".
[[rules]]
style_out = "script"
extensions = ["cmake"]
