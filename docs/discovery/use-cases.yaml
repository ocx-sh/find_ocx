# find_ocx discovery artifact (docs-plan steps 1-13). One file, diffable on the next run.
# Companion: docs/discovery/ia-plan.md (human render: coverage table, page table, nav, declaration patch).
# Evidence: docs/discovery/notes.md (surface, shortlist, inventory) and docs/discovery/friction-logs/*.md.
#
# Baseline for every friction log: the published find_ocx v0.3.0 module on a host with ocx 0.6.5.
# Items the P2 pipelines are expected to remove are listed under `fixed_by_plan` and must be re-verified
# after the P2 merge; they are not documentation obligations until they are confirmed to remain.

product_shape: library
sub_shape: wrapper-over-cli     # precondition sentence required above the first fence (CMake, network or mirror)
signal: friction-log-severity
# Why not a higher-priority signal: gh issue list for ocx-sh/find_ocx is empty, four pull requests exist, no
# invocation telemetry, no search logs. None of them can rank anything.
# Rank rule: more blocker items first, then more major items, from the friction log of the task. Tasks with no
# friction log yet rank below every logged task, in shortlist order (notes.md section 4). A tier is NOT derived
# from rank: the first-steps task is T02, rank 2, because T01 depends on it.
generated: 2026-10-10
surface_sources:                # where candidates came from, never docs page titles
  - entry-point                 # ocx.cmake commands and variable blocks, Findocx.cmake, the plan's target API table
  - readme-heading
  - changelog
  - issue-title                 # pull request titles only; there are no issues
out_of_scope:                   # enumerated surface entries deliberately not tasks
  - id: X01
    surface: "run the repository's own test matrix across CMake versions (C27)"
    why: "contributor task; CONTRIBUTING.md, not a reader task of the module"
  - id: X02
    surface: "refresh the embedded dist snapshot and bump the pin (C28)"
    why: "maintainer task, owned by .claude/rules/dist-snapshot.md"
  - id: X03
    surface: "script mode (cmake -P) as its own page (C22)"
    why: "one sentence in T09 and T10; no task of its own"
  - id: X04
    surface: "OCX_REFRESH (C24)"
    why: "one generated variable entry plus a sentence under T11"
  - id: X05
    surface: "private __ocx_* helpers, taskfile.yml tasks, renovate.json"
    why: "internals, not exported entry points"
  - id: X06
    surface: "write an ocx package or publish to a registry"
    why: "owned by the ocx documentation, not by find_ocx"
surface_coverage:               # every exported entry point maps to a task or an out-of-scope row
  ocx_project: [T02, T04, T05]
  ocx_package: [T01, T04, T06]
  ocx_index: [T06]
  ocx_bootstrap: [T03, T07, T09]
  ocx_self_update: [T10]
  ocx_policy: [T13]
  "include(ocx)": [T02, T09]
  "find_package(ocx), ocx::ocx": [T09]
  "OCX_* variables": [T03, T07, T11, T15]

tasks:
  - id: T01
    task: "make the build find a library or tool that the build itself provisioned"
    source: entry-point
    source_detail: "ocx_package PULL and <name>_ROOT (ocx.cmake); examples/package; README"
    signal: friction-log-severity
    rank: 1
    rank_basis: "2 blocker, 2 major, 4 minor"
    tier: everyday
    depends_on: [T02, T06]
    friction_log: docs/discovery/friction-logs/find-package-sees-ocx-content.md
    user_need:
      as_a: "CMake author whose build also needs a tool or library to be located through the usual CMake search"
      i_need_to: "have that search return the copy the build provisioned, never a copy already on the host"
      so_that: "the build behaves the same on my machine, a teammate's machine and a CI runner"
    solution_shaped: false
    existing_page: site/pages/guides/find-package.md
    page_word_count: 189
    page_status: adequate       # but the page promises more than the module does; see must_cover
    action: expand
    must_cover:
      - "which search commands honour <name>_ROOT (find_package does, a top-level find_program does not)"
      - "a recipe that locates a program inside provisioned content, and where the binary sits in that content"
      - "what find_package(<tool>) means for a package that ships no find or config module"
      - "how to list per-platform digests for PINS (the plain install table omits them)"
    fixed_by_plan:
      - "PATH ocx 0.6 makes <name>_ROOT a multi-line JSON value with a newline-truncation warning and exit 0 (module reads 0.3 JSON shapes)"
      - "docs and README name ocx run, which 0.6 renamed to ocx exec"
  - id: T02
    task: "run a specific version of a command-line tool from a build step on a machine that does not have it installed"
    source: entry-point
    source_detail: "ocx_project BINS and OCX_<NAME>_RUN (ocx.cmake); examples/project; README quick start"
    signal: friction-log-severity
    rank: 2
    rank_basis: "1 blocker, 2 major"
    tier: first-steps
    depends_on: []
    friction_log: docs/discovery/friction-logs/first-tool-in-build.md
    user_need:
      as_a: "CMake author whose build needs a command-line tool such as a JSON processor that is not installed on my machine"
      i_need_to: "run an exact version of that tool from a build step"
      so_that: "a teammate or a CI runner builds with nothing installed beyond CMake"
    solution_shaped: false
    existing_page: site/pages/tutorial.md
    page_word_count: 321
    page_status: adequate
    action: expand
    must_cover:
      - "precondition sentence above the first fence: CMake and network access or a mirror"
      - "the lock file must come from a CLI the module can read; blocked-network readers cannot install a CLI first (open question O1 in ia-plan.md)"
      - "the quick start's custom command is attached to a target and prints the tool's output when built"
      - "the quick start states that an ocx.toml and an ocx.lock must exist, and ends on observed jq output"
    fixed_by_plan:
      - "bootstrapped ocx 0.3.11 rejects the lock_version 3 file that ocx 0.6.5 writes; the error then wrongly says to run ocx lock"
      - "the README pairs ocx_project with a floating ocx_package line that stops configure"
  - id: T03
    task: "configure and build behind a corporate mirror or with no network, with credentials kept out of build outputs"
    source: entry-point
    source_detail: "OCX_INSTALL_DIST_URL, OCX_INSTALL_MIRROR_URL, OCX_MIRRORS, OCX_AUTH_*, OCX_BOOTSTRAP, OCX_OFFLINE (ocx.cmake)"
    signal: friction-log-severity
    rank: 3
    rank_basis: "0 blocker, 4 major, 5 minor"
    tier: integration
    depends_on: [T02, T06]
    friction_log: docs/discovery/friction-logs/configure-behind-mirror.md
    user_need:
      as_a: "platform engineer whose build machines can reach only an internal mirror, or nothing"
      i_need_to: "serve every download from inside my network and keep registry credentials out of caches and project files"
      so_that: "the build passes security review and keeps working when the public hosts are unreachable"
    solution_shaped: false
    existing_page: site/pages/guides/mirror.md
    page_word_count: 253
    page_status: adequate
    action: expand
    must_cover:
      - "which files to host: the manifest URL, the musl target, archive extension by version"
      - "how a registry name becomes the OCX_AUTH_<REGISTRY> variable name, and how to confirm a credential was used"
      - "which upstream hosts leave the network after the CLI download (registry pulls) and what OCX_MIRRORS replaces"
      - "the knobs are sticky per build directory, so a changed setting needs a fresh build directory or a cache edit"
      - "going offline needs a prior eager pull, otherwise the offline exec fails with exit 81"
      - "a private CA bundle for the mirror's certificate (OCX_EXTRA_CA_CERTS), named in the plan's mirror how-to"
    fixed_by_plan:
      - "download failure message hides HTTP status and target (file DOWNLOAD cannot compute hash)"
      - "version status line prints the old pin next to the new download"
      - "ocx run deprecation warning on every launcher run"
