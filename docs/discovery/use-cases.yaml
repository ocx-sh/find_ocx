# ------------------------------------------------------------------------------------------------------
# IA plan (step 11). Sidebar of site/astro.config.mjs, base /integrations/cmake/. The first-steps group and
# the everyday group are different top-level groups. Every `write` page traces to a task id.
# casts: file under site/casts/ (scripts with `# cast: true`; `# doc:` is the page path plus the cast name);
#        status planned = named in the plan's D2, proposed = added by this discovery, drop if budget bites.
# backed_by: files that make every code fence on the page a tested one (DOC-EX-01/02); `new` = to be created.
ia_plan:
  groups:
    - label: "Get started"
      tier: first-steps
      pages:
        - path: site/pages/index.md
          doc_type: landing
          doc_tier: first-steps
          action: expand
          serves: [T02]
          casts: []
          backed_by: [examples/project/CMakeLists.txt]
        - path: site/pages/tutorial.md
          doc_type: tutorial
          doc_tier: first-steps
          action: expand
          serves: [T02]
          casts:
            - {file: site/casts/tutorial__first-configure.sh, status: exists}
          backed_by: [site/casts/tutorial__first-configure.sh, examples/project/ocx.toml, examples/project/CMakeLists.txt]
    - label: "Everyday"
      tier: everyday
      pages:
        - path: site/pages/guides/index.md
          doc_type: landing
          doc_tier: everyday
          action: write
          serves: [T01, T05, T06, T09, T10, T11, T12, T14]
          casts: []
          backed_by: []
        - path: site/pages/guides/add-a-tool.md
          renamed_from: site/pages/guides/workspace-tools.md
          doc_type: how-to
          doc_tier: everyday
          action: expand
          serves: [T05]
          casts:
            - {file: site/casts/guides-add-a-tool__stale-lock.sh, status: proposed}
            - {file: site/casts/guides-add-a-tool__bins-typo.sh, status: planned}
          backed_by: [examples/project/ocx.toml, examples/project/ocx.lock, examples/project/CMakeLists.txt, examples/project/hello.sh, tests/fixtures/stale_lock/CMakeLists.txt, tests/fixtures/project_run/CMakeLists.txt, "new: BINS-typo fixture from I4", "new: tests/fixtures/project_groups (GROUPS default lint, no host shellcheck)"]
        - path: site/pages/guides/pin-and-freeze.md
          doc_type: how-to
          doc_tier: everyday
          action: expand
          serves: [T06]
          casts:
            - {file: site/casts/guides-pin-and-freeze__floating-fatal.sh, status: planned}
            - {file: site/casts/guides-pin-and-freeze__frozen-offline.sh, status: planned}
          backed_by: [tests/fixtures/floating_fatal.cmake, examples/frozen_index/CMakeLists.txt, examples/package/CMakeLists.txt, "examples/package/index/**"]
        - path: site/pages/guides/find-package.md
          retitle: "Make the build find provisioned content"
          doc_type: how-to
          doc_tier: everyday
          action: expand
          serves: [T01]
          casts:
            - {file: site/casts/guides-find-package__find-program.sh, status: proposed}
          backed_by: [examples/package/CMakeLists.txt, "new: find_program HINTS block and ctest in examples/package"]
        - path: site/pages/guides/use-system-ocx.md
          doc_type: how-to
          doc_tier: everyday
          action: write         # split out of guides/find-package.md "Find the ocx CLI"
          serves: [T09]
          casts:
            - {file: site/casts/guides-use-system-ocx__find-package-ocx.sh, status: planned}
          backed_by: [examples/find_package/CMakeLists.txt, tests/fixtures/bootstrap/CMakeLists.txt, tests/fixtures/bootstrap_off.cmake]
        - path: site/pages/guides/update-vendored.md
          doc_type: how-to
          doc_tier: everyday
          action: expand
          serves: [T10]
          casts: []
          backed_by: [tests/self_update_check.cmake, tests/fixtures/script_mode.cmake]
        - path: site/pages/guides/migrate-0.4.md
          doc_type: how-to
          doc_tier: everyday
          action: write
          blocked_on: "P2 merge (floor, PLATFORM list, ocx exec, new keywords)"
          serves: [T14]
          casts: []
          backed_by: ["new: I4 fixtures for the PLATFORM-list error and the 3.25 floor", CHANGELOG.md]
    - label: "Integrate"
      tier: integration
      pages:
        - path: site/pages/guides/ci.md
          doc_type: how-to
          doc_tier: integration
          action: expand
          serves: [T07]
          casts: []
          backed_by: [.github/workflows/ci.yml, tests/fixtures/package/CMakeLists.txt, tests/fixtures/bootstrap/CMakeLists.txt]
        - path: site/pages/guides/mirror.md
          doc_type: how-to
          doc_tier: integration
          action: expand
          serves: [T03]
          casts:
            - {file: site/casts/guides-mirror__bootstrap.sh, status: planned}
          backed_by: [tests/fixtures/bootstrap/CMakeLists.txt, "new: tests/fixtures/mirror (local static host serving dist.json and the archive)"]
        - path: site/pages/guides/cross-build.md
          doc_type: how-to
          doc_tier: integration
          action: expand
          serves: [T04]
          casts:
            - {file: site/casts/guides-cross-build__foreign-paths.sh, status: proposed}
          backed_by: [tests/fixtures/foreign_platform/CMakeLists.txt, "new: tests/fixtures/foreign_toolchain (toolchain file with once-only guard, ocx_project PLATFORM)"]
        - path: site/pages/guides/policy-and-config.md
          doc_type: how-to
          doc_tier: integration
          action: write
          blocked_on: "P2 merge (ocx_policy, CONFIG, NO_CONFIG, PATCH_SNAPSHOT)"
          serves: [T13]
          casts: []
          backed_by: ["new: I2/I4 tests for policy and config keywords"]
    - label: "Concepts"
      tier: none
      pages:
        - path: site/pages/concepts/how-it-works.md
          doc_type: explanation
          action: keep
          serves: [T09]
          casts: []
          backed_by: []
        - path: site/pages/concepts/entry-points.md
          doc_type: explanation
          action: expand
          serves: [T09]
          casts: []
          backed_by: [examples/find_package/CMakeLists.txt]
        - path: site/pages/concepts/reproducible-first.md
          doc_type: explanation
          action: expand
          serves: [T06]
          casts: []
          backed_by: []
        - path: site/pages/concepts/lazy-vs-eager.md
          doc_type: explanation
          action: expand
          serves: [T11]
          casts: []
          backed_by: [tests/reconfigure_check.cmake]
        - path: site/pages/concepts/env-and-config.md
          doc_type: explanation
          action: write
          blocked_on: "P2 merge (env-class table)"
          serves: [T03, T13]
          casts: []
          backed_by: ["new: I2/I4 tests for ambient OCX_QUIET, OCX_GLOBAL, OCX_NO_CONFIG"]
    - label: "Troubleshooting"
      tier: none
      pages:
        - path: site/pages/troubleshooting/configure-errors.md
          renamed_from: site/pages/guides/nested-builds.md
          doc_type: troubleshooting
          action: expand
          serves: [T05, T06, T08, T12]
          casts: []
          backed_by: [tests/fixtures/stale_lock/CMakeLists.txt, tests/fixtures/floating_fatal.cmake, tests/fixtures/package/subproject/CMakeLists.txt, "new: BINS-typo and duplicate-NAME fixtures asserting the quoted message"]
        - path: site/pages/troubleshooting/exit-codes.md
          doc_type: troubleshooting
          action: write
          blocked_on: "P2 merge (hint table 64-87)"
          serves: [T12]
          casts: []
          backed_by: ["new: tests/hint_table_check.cmake comparing this table with the module's hint table"]
    - label: "Reference"
      tier: none
      pages:
        - path: site/pages/reference/commands.md
          doc_type: reference
          action: keep
          serves: [T15]
          casts: []
          backed_by: ["ocx.cmake #[=[.rst: blocks"]
        - path: site/pages/reference/variables.md
          doc_type: reference
          action: keep
          serves: [T15]
          casts: []
          backed_by: ["ocx.cmake #[=[.rst: blocks"]
        - path: site/pages/reference/findocx.md
          doc_type: reference
          action: keep
          serves: [T09, T15]
          casts: []
          backed_by: ["Findocx.cmake #[=[.rst: block"]
  readme:
    - path: README.md
      doc_type: readme
      action: expand            # quick start replaced by a tested snippet that prints output; links to the site
      serves: [T02]
      casts: []
      backed_by: [examples/project/CMakeLists.txt]
  deletes:
    - path: site/pages/reference/examples.md
      unmapped: true            # no task is "browse examples"; T15 is served by commands, variables, findocx
      stub: true                # 68 prose words; duplicate of the tested files the how-tos embed
      exempt: false             # body is a one-shot `port:` include from the retired examples.rst, not an API generator (`cmake:` is)
    - path: site/pages/reference/examples-packages.md
      unmapped: true
      stub: true                # 37 prose words
      exempt: false
    - path: site/pages/reference/examples-discovery.md
      unmapped: true
      stub: true                # 47 prose words
      exempt: false
  retired_by_decision:          # not delete-list rows: removed by the owner's decision to retire Sphinx, after the prose is rewritten
    - docs/index.rst
    - docs/examples.rst
    - docs/reference.rst        # generator-directive page, would be exempt; its job moves to the generated reference pages
    - docs/conf.py
    - docs/pyproject.toml
    - docs/uv.lock
