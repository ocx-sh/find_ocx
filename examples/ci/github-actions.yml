# Example: a GitHub Actions workflow that builds with the same pinned ocx and
# the same locked tools on Linux, macOS and Windows. Copy it to
# .github/workflows/build.yml. It is checked with actionlint, not run here.

# region workflow
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Keep both ocx caches inside the workspace so one cache step restores them.
      OCX_HOME: ${{ github.workspace }}/.cache/ocx-home
      OCX_BOOTSTRAP_CACHE: ${{ github.workspace }}/.cache/ocx-bootstrap
    steps:
      # Pinned to exact version tags. Pin a commit SHA instead where supply-chain
      # policy allows: a tag can move, a SHA cannot.
      - uses: actions/checkout@v5.1.0

      - uses: actions/cache@v4.3.0
        with:
          path: .cache
          key: ocx-${{ runner.os }}-${{ hashFiles('ocx.lock') }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DOCX_BOOTSTRAP=ALWAYS -DOCX_PULL=ON

      - name: Build and test
        shell: bash
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Configure again, offline
        shell: bash
        env:
          OCX_OFFLINE: "1"
        run: cmake -S . -B build/offline -DOCX_BOOTSTRAP=ALWAYS -DOCX_PULL=ON
# endregion
